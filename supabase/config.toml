# Iconic Rentals — Supabase CLI project configuration
#
# Generated as part of Phase 6.0 (Supabase backend foundation). This lets
# the Supabase CLI (`supabase link`, `supabase db push`, `supabase
# functions deploy`, `supabase start` for local dev) operate on this
# project instead of every change going through the dashboard's SQL
# Editor by hand, the way supabase/schema.sql was originally applied.
#
# This file holds non-secret configuration only. Real secrets (access
# token, DB password) belong in a local, git-ignored .env — see
# .env.example at the project root — and are referenced below via env().
#
# Phase 6.0 laid this file down with no tables/buckets declared. Phase 6.1
# discovered the site owner had already created a set of storage buckets
# directly in the dashboard — including fleet-images, fleet-videos,
# experience-images, and experience-videos, which is what this phase
# needs — so those are declared below for local dev parity rather than a
# new bucket being invented. See supabase/migrations/
# 20260726130400_storage_fleet_experience_buckets.sql for the actual
# configuration step against the hosted project (those buckets already
# existed there; this migration only added RLS policies and confirmed
# `public = true`). logos, hero, gallery, instagram, documents, and
# avatars also already exist on the hosted project — out of this phase's
# scope, so left undeclared here too.

project_id = "slokljslqyanbqabvzkk"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Public sign-ups stay off — admin dashboard accounts are created directly
# in the Supabase dashboard by the site owner, per CLIENT_SETUP.md's
# "Admin Dashboard Access" section. Mirrors that same setting on the
# hosted project so local dev behaves the same way as production.
enable_signup = false

[storage]
enabled = true

[storage.buckets.fleet-images]
public = true

[storage.buckets.fleet-videos]
public = true

[storage.buckets.experience-images]
public = true

[storage.buckets.experience-videos]
public = true
# Path convention: {slug}/{section}/{slot_key}.{ext} in the fleet-*
# buckets, {experience_id}/{kind}-{n}.{ext} in the experience-* buckets —
# see the storage migration for the full rationale. No files are seeded
# here; this only gives local dev the same buckets the hosted project has.

[edge_runtime]
enabled = true
policy = "oneshot"

# Used by `supabase functions serve` for the existing send-booking-emails
# function's local secrets (RESEND_API_KEY, OWNER_EMAIL, FROM_EMAIL — see
# CLIENT_SETUP.md, "Email Configuration"). That file is not created by
# this phase; create supabase/functions/.env locally if you need to run
# the function against local secrets.
